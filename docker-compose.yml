services:
  app:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      APPLYGO_DATABASE_URL: postgresql+psycopg://applygo:applygo@db:5432/applygo
      APPLYGO_STORAGE_DIR: /app/data/private
    volumes:
      - private_data:/app/data/private
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: applygo
      POSTGRES_PASSWORD: applygo
      POSTGRES_DB: applygo
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U applygo"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
volumes:
  postgres_data:
  private_data:

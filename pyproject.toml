[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "applygo"
version = "0.2.0"
description = "Private, evidence-grounded job search and application intelligence"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "sqlalchemy>=2.0",
  "pydantic-settings>=2.6",
  "python-multipart>=0.0.12",
  "jinja2>=3.1",
  "pypdf>=5.1",
  "httpx>=0.28",
  "openai>=1.55",
  "anthropic>=0.40",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "ruff>=0.8",
  "mypy>=1.13",
]
postgres = ["psycopg[binary]>=3.2"]

[project.scripts]
applygo = "applygo.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["applygo"]

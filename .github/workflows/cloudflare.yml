name: Cloudflare Control Plane

on:
  pull_request:
    paths:
      - "cloudflare/**"
      - ".github/workflows/cloudflare.yml"
  push:
    branches: [main]
    paths:
      - "cloudflare/**"
      - ".github/workflows/cloudflare.yml"

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: cloudflare/package.json
      - name: Install dependencies
        run: npm install
      - name: Type check
        run: npm run typecheck
      - name: Dry-run build
        run: npm run check

site_name: ApplyGo Engineering Portal
site_description: Product discovery, value-stream analysis, architecture research, and technical decisions for ApplyGo
repo_name: jasonsheinkopf/ApplyGo
repo_url: https://github.com/jasonsheinkopf/ApplyGo
edit_uri: edit/main/docs/

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Discovery:
      - Overview: discovery/index.md
      - Problem and Product Thesis: discovery/problem-thesis.md
      - Current-State Value Stream: discovery/value-stream.md
      - Human, AI, and System Boundaries: discovery/system-boundaries.md
      - Research Method: discovery/research-method.md
  - Market Landscape:
      - Overview: market/index.md
      - Existing Workflow Tools: market/existing-tools.md
      - Competitive Gap Analysis: market/gap-analysis.md
  - Product Strategy:
      - Progressive Autonomy: product/progressive-autonomy.md
      - Capability Map: product/capability-map.md
      - Requirements: product/requirements.md
      - Resume Guidelines: product/resume-guidelines.md
  - Architecture:
      - Local and Cloudflare Dual Mode: architecture/local-cloudflare-dual-mode.md
      - Task-Aware Model Routing: architecture/model-provider-routing.md
  - Technology:
      - Technology Landscape: technology/index.md
      - Execution and Deployment: technology/execution-deployment.md
      - Browser Automation: technology/browser-automation.md
      - Models and Orchestration: technology/models-orchestration.md
      - Evaluation and Observability: technology/evaluation-observability.md
      - Langfuse Prompt Sync: technology/langfuse-prompt-sync.md
  - Workflow:
      - Complete Agent Workflow: workflow/agent-workflow.md
      - Strengthen Profile: workflow/strengthen-profile.md
  - Implementation Stages:
      - First Vertical Slice: stages/first-vertical-slice.md
      - Candidate Profile Workspace: stages/profile-workspace.md
  - Decisions:
      - Decision Register: decisions/index.md
      - Initial Recommendations: decisions/initial-recommendations.md
      - ADR-013 Private Runtime Data: decisions/adr-013-private-runtime-data.md
      - ADR-014 Local and Cloudflare Modes: decisions/adr-014-dual-mode-cloudflare.md
      - ADR-015 Task-Aware Model Routing: decisions/adr-015-task-aware-model-routing.md
  - Roadmap:
      - Phases and Exit Criteria: roadmap/phases.md
